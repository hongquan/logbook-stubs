name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group lint
      - name: Run Ruff
        run: uv run ruff check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Install zuban
        run: uv tool install zuban
      - name: Run zuban
        run: uvx zuban check

  build-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group docs
      - name: Build documentation
        run: .venv/bin/sphinx-build docs/source docs/build/html

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-sdist
          path: dist/*.tar.gz
      - name: Upload wheel
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-wheel
          path: dist/*.whl

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [build, lint, type-check, build-doc]
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: pypa/gh-action-pypi-publish@v1.14.2
